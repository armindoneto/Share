<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BeamShare // Quantum Uplink</title>
  <style>
    :root {
      --cyan: #38bdf8;
      --cyan-bright: #7dd3fc;
      --cyan-glow: rgba(56, 189, 248, 0.4);
      --amber: #fbbf24;
      --amber-glow: rgba(251, 191, 36, 0.35);
      --dark-core: #030712;
      --panel-bg: rgba(15, 23, 42, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #0b1329 0%, var(--dark-core) 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Grade de chão estilizada como plataforma de teletransporte */
    body::before {
      content: "";
      position: absolute;
      bottom: -150px;
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse at center, var(--cyan-glow) 0%, transparent 70%);
      border-radius: 50%;
      transform: perspective(600px) rotateX(75deg);
      pointer-events: none;
      animation: pulsePad 4s ease-in-out infinite alternate;
    }

    @keyframes pulsePad {
      0% { opacity: 0.3; filter: blur(30px); }
      100% { opacity: 0.8; filter: blur(45px); }
    }
