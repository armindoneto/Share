<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BeamShare</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #0f2b48 0%, #030712 85%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(56, 189, 248, 0.2);
      text-align: center;
    }

    /* Cabeçalho */
    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
    }

    .tagline {
      font-size: 11px;
      letter-spacing: 2px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-top: 4px;
      margin-bottom: 22px;
      opacity: 0.85;
    }

    /* Câmara / Pad de Teletransporte */
    .transporter-chamber {
      background: rgba(3, 7, 18, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      padding: 20px 14px;
      margin-bottom: 20px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .status-text {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .file-display {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      word-break: break-all;
      line-height: 1.4;
    }

    /* Botão Principal de Compartilhamento */
    .btn-beam {
      width: 100%;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.35);
      margin-bottom: 18px;
      transition: all 0.2s ease;
    }

    .btn-beam:disabled {
      background: #1e293b;
      border-color: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-beam:not(:disabled):active {
      transform: scale(0.98);
      filter: brightness(1.2);
    }

    /* Área de Injeção de Arquivo (PC) */
    .upload-zone {
      border: 1px dashed rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.6);
      cursor: pointer;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: border-color 0.2s;
    }

    .upload-zone:hover {
      border-color: #38bdf8;
      color: #e2e8f0;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title">BeamShare</div>
    <div class="tagline">Molecular File Relocation</div>

    <!-- Câmara de Matéria -->
    <div class="transporter-chamber">
      <div id="statusLabel" class="status-text">Telemetria Ativa</div>
      <div id="fileInfo" class="file-display">Sincronizando com o Drive...</div>
    </div>

    <!-- Botão de Compartilhar (1 Toque) -->
    <button id="btnShare" class="btn-beam" disabled>
      SINCRONIZANDO BUFFER...
    </button>
