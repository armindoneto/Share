<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeamShare</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 24px; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1e1e1e; border: 1px solid #333; border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; text-align: center; }
    .status { margin-bottom: 20px; font-size: 15px; color: #aaa; word-break: break-all; }
    .btn { display: block; width: 100%; padding: 18px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-share { background: #2563eb; color: white; margin-top: 12px; }
    .btn-share:active { background: #1d4ed8; }
    .upload-area { border: 2px dashed #444; border-radius: 12px; padding: 24px; margin-top: 24px; cursor: pointer; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div id="fileInfo" class="status">Verificando último arquivo...</div>

    <!-- Botão principal focado no Android -->
    <button id="btnShare" class="btn-share" style="display: none;">COMPARTILHAR ARQUIVO</button>

    <!-- Área secundária de envio (para quando abrir no PC) -->
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <span id="uploadText">Carregar novo arquivo (PC)</span>
      <input type="file" id="fileInput">
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXsT7cSaUJaI0PJKRIPosXYaaJb7nXMI5ehRUe1Rk0lgii1U9ifOpybtANpyZ0eluw/exec"; 
    
    let currentBlob = null;
    let currentFileName = "";

    // 1. Ao carregar a página no Android, busca o último arquivo disponível
    async function loadLatestFile() {
      const info = document.getElementById("fileInfo");
      const btn = document.getElementById("btnShare");
      try {
        info.innerText = "Buscando arquivo no Drive...";
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();

        if (data.status === "success") {
          currentFileName = data.name;
          info.innerHTML = `Pronto: <b>${data.name}</b>`;

          // Converte Base64 para Blob/File no navegador
          const byteCharacters = atob(data.base64);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
          }
          const byteArray = new Uint8Array(byteNumbers);
          currentBlob = new File([byteArray], data.name, { type: data.mimeType });

          btn.style.display = "block";
        } else {
          info.innerText = "Nenhum arquivo encontrado no Drive.";
        }
      } catch (e) {
        info.innerText = "Erro ao carregar: " + e.message;
      }
    }

    // 2. Dispara a folha de compartilhamento nativa do Android (1 toque)
    document.getElementById("btnShare").addEventListener("click", async () => {
      if (!currentBlob) return;

      if (navigator.canShare && navigator.canShare({ files: [currentBlob] })) {
        try {
          await navigator.share({
            files: [currentBlob],
            title: currentFileName
          });
        } catch (err) {
          if (err.name !== "AbortError") alert("Erro ao compartilhar: " + err);
        }
      } else {
        alert("O compartilhamento nativo de arquivos não é suportado por este navegador.");
      }
    });
