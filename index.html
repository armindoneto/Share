<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BeamShare</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      /* O fundo fica no <html>: com body em position:fixed o gradiente
         era calculado sobre uma altura 0 e aparecia branco. */
      background-color: #020611;
      background-image:
        radial-gradient(ellipse 60% 45% at 50% 100%, rgba(56, 189, 248, 0.38) 0%, rgba(2, 132, 199, 0.12) 45%, transparent 75%),
        radial-gradient(ellipse 35% 100% at 50% 40%, rgba(125, 211, 252, 0.14) 0%, transparent 70%),
        linear-gradient(180deg, #030a1c 0%, #072447 55%, #0b3a66 100%);
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    body {
      color: #f8fafc;
      min-height: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: transparent;
    }

    /* Feixe do transportador: coluna de luz atrás do cartão */
    .beam-column {
      position: fixed;
      left: 50%;
      top: 0;
      bottom: 0;
      width: min(340px, 90vw);
      transform: translateX(-50%);
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(125, 211, 252, 0.07) 30%,
        rgba(125, 211, 252, 0.16) 70%,
        rgba(186, 230, 253, 0.28) 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent);
              mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent);
      pointer-events: none;
      z-index: 0;
    }

    #sparkles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(6, 18, 40, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 20px;
      padding: 26px 20px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(56, 189, 248, 0.2);
      text-align: center;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: rgba(186, 230, 253, 0.6);
      pointer-events: none;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .brand-icon {
      height: 64px;
      width: auto;
      flex-shrink: 0;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.55));
    }

    .brand-text {
      text-align: left;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
    }

    .tagline {
      font-size: 11px;
      letter-spacing: 2px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .chamber {
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 18px 12px;
      margin-bottom: 18px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .status-text {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .file-display {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      word-break: break-all;
      line-height: 1.4;
    }

    .btn-beam {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.35);
      margin-bottom: 16px;
    }

    .btn-beam:active {
      filter: brightness(1.2);
    }

    .upload-zone {
      border: 1px dashed rgba(56, 189, 248, 0.5);
      border-radius: 12px;
      padding: 14px;
      background: rgba(15, 23, 42, 0.8);
      cursor: pointer;
      color: #7dd3fc;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <div class="beam-column"></div>
  <canvas id="sparkles"></canvas>

  <div class="container">
    <div class="brand">
      <img class="brand-icon" src="favicon.png" alt="">
      <div class="brand-text">
        <div class="title">BeamShare</div>
        <div class="tagline">Transferência Instantânea</div>
      </div>
    </div>

    <div class="chamber">
      <div id="statusLabel" class="status-text">Telemetria Ativa</div>
      <div id="fileInfo" class="file-display">Sincronizando com o Drive...</div>
    </div>

    <!-- Botão com clique direto para o menu nativo do Android -->
    <button id="btnShare" class="btn-beam" style="display: none;">
      COMPARTILHAR
    </button>

    <!-- Upload (PC) -->
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
      <span id="uploadText">[+] CARREGAR NOVO ARQUIVO</span>
      <input type="file" id="fileInput">
    </div>
  </div>

  <footer class="footer">2026 - v1.0.0 - Desenvolvido por Armindo Neto</footer>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXsT7cSaUJaI0PJKRIPosXYaaJb7nXMI5ehRUe1Rk0lgii1U9ifOpybtANpyZ0eluw/exec"; 
    
    let currentBlob = null;
    let currentFileName = "";

    async function loadLatestFile() {
      const info = document.getElementById("fileInfo");
      const statusLabel = document.getElementById("statusLabel");
      const btn = document.getElementById("btnShare");

      statusLabel.innerText = "Consultando Drive...";
      info.innerText = "Conectando ao servidor...";

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        if (data.status === "success") {
          currentFileName = data.name;
          statusLabel.innerText = "● Pronto Para Envio";
          statusLabel.style.color = "#4ade80";
          info.innerText = data.name;

          // Conversão de base64 para binário nativo
          const byteCharacters = atob(data.base64);
          const byteArray = new Uint8Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) {
            byteArray[i] = byteCharacters.charCodeAt(i);
          }
          currentBlob = new File([byteArray], data.name, { type: data.mimeType });

          btn.style.display = "block";
        } else {
          statusLabel.innerText = "Buffer Vazio";
          info.innerText = "Nenhum arquivo encontrado.";
          btn.style.display = "none";
        }
      } catch (err) {
        statusLabel.innerText = "Falha de Leitura";
        statusLabel.style.color = "#f87171";
        info.innerText = "Erro: " + err.message;
        btn.style.display = "none";
      }
    }

    // Ação nativa de 1 clique
    document.getElementById("btnShare").addEventListener("click", async () => {
      if (!currentBlob) return;

      if (navigator.canShare && navigator.canShare({ files: [currentBlob] })) {
        try {
          await navigator.share({
            files: [currentBlob],
            title: currentFileName
          });
        } catch (e) {
          if (e.name !== "AbortError") alert("Erro: " + e.message);
        }
      } else {
        alert("O seu navegador não suporta o compartilhamento direto de arquivos.");
      }
    });

    // Envio pelo PC
    document.getElementById("fileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const uploadText = document.getElementById("uploadText");
      uploadText.innerText = "Enviando arquivo...";

      const reader = new FileReader();
      reader.onload = async () => {
        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({
              name: file.name,
              mimeType: file.type || "application/octet-stream",
              base64: reader.result
            })
          });
          uploadText.innerText = "Arquivo Carregado!";
          loadLatestFile();
        } catch (err) {
          uploadText.innerText = "Erro no envio.";
        }
      };
      reader.readAsDataURL(file);
    });

    loadLatestFile();

    // Partículas do teletransporte (brilhos azuis e dourados subindo no feixe)
    (function () {
      const canvas = document.getElementById("sparkles");
      const ctx = canvas.getContext("2d");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let w, h, parts = [];

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function spawn(initial) {
        const half = Math.min(170, w * 0.45);
        const gold = Math.random() < 0.22;
        return {
          x: w / 2 + (Math.random() * 2 - 1) * half,
          y: initial ? Math.random() * h : h + 10,
          r: Math.random() * 1.8 + 0.4,
          vy: Math.random() * 0.7 + 0.25,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.06 + 0.02,
          color: gold ? "255, 214, 120" : "186, 230, 253"
        };
      }

      function init() {
        resize();
        const count = Math.round(Math.min(160, w * h / 6000));
        parts = Array.from({ length: count }, () => spawn(true));
      }

      function frame() {
        ctx.clearRect(0, 0, w, h);
        for (const p of parts) {
          p.y -= p.vy;
          p.phase += p.speed;
          const a = 0.25 + 0.75 * Math.abs(Math.sin(p.phase));
          ctx.beginPath();
          ctx.fillStyle = "rgba(" + p.color + "," + a.toFixed(2) + ")";
          ctx.shadowColor = "rgba(" + p.color + ",0.9)";
          ctx.shadowBlur = 8;
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          if (p.y < -10) Object.assign(p, spawn(false));
        }
        if (!reduce) requestAnimationFrame(frame);
      }

      window.addEventListener("resize", init);
      init();
      frame();
    })();
  </script>
</body>
</html>
