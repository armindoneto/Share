<!DOCTYPE html>
<html lang="pt-BR">

      padding: 20px;

      text-align: center;
    }

      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
